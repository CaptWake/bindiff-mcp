[project]
name = "bindiff-mcp"
version = "1.0.0"
description = "Bindiff MCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ida-nexus>=0.13.3",
    "python-bindiff>=0.4.2",
    "python-binexport>=0.4.5",
    "zeromcp>=1.10.3",
]


[project.urls]
Repository = "https://github.com/CaptWake/bindiff-mcp"
Issues = "https://github.com/CaptWake/bindiff-mcp/issues"

[project.scripts]
bindiff-mcp = "bindiff_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.12.0",
    "ty>=0.0.83",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["bindiff_mcp"]
